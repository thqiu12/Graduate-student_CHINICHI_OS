# docker-compose.yml
# 知日塾大学院考学进度管理系统 - 本地开发环境
# 包含：PostgreSQL 16 + Redis 7

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chinichi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chinichi_graduate
      POSTGRES_USER: chinichi
      POSTGRES_PASSWORD: chinichi_dev_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chinichi -d chinichi_graduate']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chinichi_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: chinichi_network
